name: 'Tests: All End-to-End (including non-mature)'

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  pull_request:
    types: [opened, labeled, unlabeled, synchronize]
    branches:
      - '**'
  push:
    branches:
      - devel

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check-trigger:
    name: 'Check if workflow should run'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "$BASE_REF" = "staging" ] || [ "$BASE_REF" = "prod" ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$HAS_RUN_ALL_LABEL" = "true" ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -n "$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[] | select(.filename == "e2e/playwright.version") | .filename')" ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HAS_RUN_ALL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'run-all-e2e-tests!') }}

  e2e-tests-build:
    name: 'Tests: All e2e build'
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true'
    uses: ./.github/workflows/reusable-e2e-tests-build.yml

  e2e-tests-run:
    name: 'Tests: All e2e run'
    needs:
      - check-trigger
      - e2e-tests-build
    if: needs.check-trigger.outputs.should_run == 'true'
    uses: ./.github/workflows/reusable-e2e-tests-run.yml
