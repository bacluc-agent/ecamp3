name: Fast Forward Merge

on:
  issue_comment:
    types: [created]

jobs:
  fast_forward_job:
    name: Fast Forward
    if: |
      (github.event.issue.pull_request != '') &&
      github.event.comment.body == '/fast-forward'
    runs-on: ubuntu-latest
    steps:
      - uses: actions-cool/check-user-permission@v2
        id: has_permission
        with:
          require: 'write'

      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v3
        if: steps.has_permission.outputs.require-result != 'true'
        with:
          pr-number: ${{ github.event.issue.number }}
          message: |
            You have no write permission on this repository

      - name: Exit if no write permission
        if: steps.has_permission.outputs.require-result != 'true'
        run: exit 1

      - uses: actions/github-script@v9
        id: current_pr
        with:
          github-token: ${{ secrets.FAST_FORWARD_TOKEN }}
          script: |
            return github.rest.pulls.get({
              pull_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            })

      - run: echo $prJSON
        env:
          prJSON: ${{ toJSON(fromJSON(steps.current_pr.outputs.result).data) }}

      - uses: actions/github-script@v9
        id: check_mergeable
        with:
          github-token: ${{ secrets.FAST_FORWARD_TOKEN }}
          script: |
            return (async () => {
              const prData = JSON.parse(steps.current_pr.outputs.result).data;

              if (prData.mergeable_state === 'clean') {
                core.setOutput('allowed', 'true');
                core.setOutput('reason', '');
                return;
              }

              const baseRef = prData.base ? prData.base.ref : '';
              if (baseRef === 'staging' || baseRef === 'prod') {
                if (prData.mergeable !== true) {
                  core.setOutput('allowed', 'false');
                  core.setOutput('reason', 'PR is not mergeable (mergeable: ' + prData.mergeable + ')');
                  return;
                }

                const runs = await github.paginate(github.rest.actions.listWorkflowRunsForCommit, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: prData.head.sha,
                  per_page: 100,
                });

                const blockingRuns = [];
                let mandatoryPassed = false;

                for (const run of runs) {
                  if (run.name === 'CI (mandatory checks)' && run.conclusion === 'success') {
                    mandatoryPassed = true;
                  }
                  const badConclusions = ['failure', 'timed_out', 'cancelled', 'action_required'];
                  if (badConclusions.includes(run.conclusion)) {
                    if (run.name !== 'Tests: All End-to-End (including non-mature)') {
                      blockingRuns.push({ name: run.name, conclusion: run.conclusion, html_url: run.html_url });
                    }
                  }
                }

                if (!mandatoryPassed) {
                  core.setOutput('allowed', 'false');
                  core.setOutput('reason', 'Mandatory CI workflow "CI (mandatory checks)" has not passed (success).');
                  return;
                }

                if (blockingRuns.length > 0) {
                  const list = blockingRuns.map(r => `- ${r.name} (${r.conclusion}): ${r.html_url}`).join('\n');
                  core.setOutput('allowed', 'false');
                  core.setOutput('reason', 'Blocking failing runs from other workflows:\n' + list);
                  return;
                }

                core.setOutput('allowed', 'true');
                core.setOutput('reason', '');
                return;
              }

              core.setOutput('allowed', 'false');
              core.setOutput('reason', 'The PR mergeable_state needs to be clean, was: ' + prData.mergeable_state);
            })();

      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v3
        if: steps.check_mergeable.outputs.allowed != 'true'
        with:
          pr-number: ${{ github.event.issue.number }}
          message: ${{ steps.check_mergeable.outputs.reason }}

      - name: Exit if not allowed
        if: steps.check_mergeable.outputs.allowed != 'true'
        run: exit 1

      # To use this repository's private action, you must check out the repository
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fast Forward PR
        id: ff-action
        uses: endre-spotlab/fast-forward-js-action@2.1
        with:
          GITHUB_TOKEN: ${{ secrets.FAST_FORWARD_TOKEN }}
          success_message: 'Success! Fast forwarded ***target_base*** to ***source_head***! ```git checkout target_base && git merge source_head --ff-only``` '
          failure_message: 'Failed! Cannot do fast forward!'
