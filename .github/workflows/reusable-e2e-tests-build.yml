name: '[reusable only] e2e tests build'

on:
  workflow_call:

jobs:
  e2e-tests-build:
    name: 'Tests: End-to-end (build job)'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      # build API (using cache; provide image to docker compose)
      - name: Build docker image (API/PHP)
        run: >
          bash .github/scripts/retry.sh 3 15 docker buildx build
          --cache-from type=gha,scope=api
          --cache-to type=gha,scope=api,mode=max
          --file api/Dockerfile
          --output type=docker,dest=/tmp/ecamp3-dev-api.tar
          --tag docker.io/ecamp/ecamp3-api:latest
          --target frankenphp_prod
          --builder "${{ steps.buildx.outputs.name }}"
          --load ./api

      - uses: actions/upload-artifact@v7
        with:
          name: e2e-tests-images
          path: /tmp/ecamp3-dev-*.tar
