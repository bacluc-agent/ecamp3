name: Test Write Access Check

on:
  workflow_dispatch:
    inputs:
      test-user:
        type: string
        description: 'GitHub username to test write access for'
        required: true
        default: 'bacluc-agent'

jobs:
  test-permission-check:
    name: Test permission check for user
    runs-on: ubuntu-latest
    steps:
      - name: Check write access for test user
        id: check
        run: |
          USER="${{ github.event.inputs.test-user }}"

          echo "Testing write access for user: $USER"

          # Query GitHub GraphQL API to check if user is an org member with write access
          RESULT=$(curl -s -X POST "https://api.github.com/graphql" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.REPO_ACCESS_TOKEN }}" \
            -d "{\"query\": \"query { organization(login: \\\"ecamp\\\") { membersWithRole(first: 100, query: \\\"$USER\\\") { edges { node { login } role } } } }\"}")

          echo "GraphQL result: $RESULT"

          # Check if user is found with WRITE or ADMIN role
          HAS_ACCESS=$(echo "$RESULT" | jq -r --arg user "$USER" '.data.organization.membersWithRole.edges[] | select(.node.login == $user) | .role' | grep -E '^(WRITE|ADMIN)$' | head -1)

          if [ -n "$HAS_ACCESS" ]; then
            echo "User $USER has write access (role: $HAS_ACCESS)"
            echo "has-access=true" >> $GITHUB_OUTPUT
            echo "result=PASS" >> $GITHUB_OUTPUT
          else
            echo "User $USER does NOT have write access to ecamp/ecamp3"
            echo "has-access=false" >> $GITHUB_OUTPUT
            echo "result=FAIL" >> $GITHUB_OUTPUT
          fi

      - name: Report result
        run: |
          echo "Test result for ${{ github.event.inputs.test-user }}: ${{ steps.check.outputs.result }}"
          if [ "${{ steps.check.outputs.has-access }}" = "true" ]; then
            echo "✅ PASS: User has write access"
          else
            echo "❌ FAIL: User does not have write access"
          fi
