parameters:
    app.httpCache.matchPath: '^/?($|index.jsonhal$|content_types|camps/[0-9a-f]*/(categories|periods|material_lists|material_items|activities|checklists)|periods/[0-9a-f]*/(schedule_entries|days)|material_lists/[0-9a-f]*/material_items|content_node/material_nodes/[0-9a-f]*/material_items|activities/[0-9a-f]*/activity_responsibles|days/[0-9a-f]*/day_responsibles|checklists/[0-9a-f]*/checklist_items|activities/[0-9a-f]*)'

fos_http_cache:
    debug:
        enabled: true # this sets the X-Cache-Debug response header; can be removed later-on
    tags:
        enabled: true
        response_header: xkey
        max_header_value_length: 4096
        separator: ' '
    cache_manager:
        custom_proxy_client: App\HttpCache\VarnishProxyClient
    cache_control:
        defaults:
            overwrite: true
        rules:
            - match:
                  path: '%app.httpCache.matchPath%'
              headers:
                  overwrite: true
                  cache_control: { public: true, max_age: 0, s_maxage: 43200 }
                  vary: [Accept, Content-Type, Authorization, Origin]

            # match everything else to set defaults
            - match:
                  path: ^/
              headers:
                  overwrite: true
                  cache_control: { no-cache: true, private: true }
                  vary: [Accept, Content-Type, Authorization, Origin]
