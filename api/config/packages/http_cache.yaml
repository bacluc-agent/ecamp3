parameters:
    # content_node/checklist_nodes/{id}/checklist_items is intentionally NOT cached:
    # PurgeHttpCacheListener::invalidateCollection cannot generate that route's IRI
    # (checklistNodeId maps to a ManyToMany collection -> NoSuchPropertyException),
    # so caching it would serve stale data.
    app.httpCache.matchPath: '^/?($|index.jsonhal$|content_types|camps/[0-9a-f]*/categories|periods/[0-9a-f]*/schedule_entries|camps/[0-9a-f]*/activities|camps/[0-9a-f]*/checklists|activities/[0-9a-f]*|periods/[0-9a-f]*/days|camps/[0-9a-f]*/periods|camps/[0-9a-f]*/material_lists|camps/[0-9a-f]*/material_items|camps/[0-9a-f]*/comments|material_lists/[0-9a-f]*/material_items|content_node/material_nodes/[0-9a-f]*/material_items|periods/[0-9a-f]*/material_items|users/[0-9a-f]*/profiles|camps/[0-9a-f]*/activity_progress_labels|camps/[0-9a-f]*/camp_collaborations|days/[0-9a-f]*/day_responsibles|checklists/[0-9a-f]*/checklist_items)'

fos_http_cache:
    debug:
        enabled: true # this sets the X-Cache-Debug response header; can be removed later-on
    tags:
        enabled: true
        response_header: xkey
        max_header_value_length: 4096
        separator: ' '
    cache_manager:
        custom_proxy_client: App\HttpCache\VarnishProxyClient
    cache_control:
        defaults:
            overwrite: true
        rules:
            - match:
                  path: '%app.httpCache.matchPath%'
              headers:
                  overwrite: true
                  cache_control: { public: true, max_age: 0, s_maxage: 43200 }
                  vary: [Accept, Content-Type, Authorization, Origin]

            # match everything else to set defaults
            - match:
                  path: ^/
              headers:
                  overwrite: true
                  cache_control: { no-cache: true, private: true }
                  vary: [Accept, Content-Type, Authorization, Origin]
