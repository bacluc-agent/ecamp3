services:
  cockroachdb:
    image: cockroachdb/cockroach:v24.3.0
    container_name: ecamp3-cockroachdb
    ports:
      - '26257:26256'
      - '8080:8080'
    command: start-single-node --insecure --listen-addr=:26257 --sql-addr=:26256 --http-addr=0.0.0.0:8080
    volumes:
      - cockroachdb-data:/cockroach/cockroach-data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'cockroach sql --insecure --host=localhost:26256 --execute="CREATE DATABASE IF NOT EXISTS ecamp3; CREATE USER IF NOT EXISTS ecamp3; GRANT ALL ON DATABASE ecamp3 TO ecamp3"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  cockroachdb-data:
