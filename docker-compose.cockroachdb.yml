services:
  cockroachdb:
    image: cockroachdb/cockroach:v24.3.0
    container_name: ecamp3-cockroachdb
    ports:
      - "26257:26257"
    command: start-single-node --insecure --listen-addr=0.0.0.0:26257 --sql-addr=0.0.0.0:26257 --http-addr=127.0.0.1:8080
    volumes:
      - cockroachdb-data:/cockroach/cockroach-data
    environment:
      - COCKROACH_DATABASE=ecamp3
    healthcheck:
      test: ["CMD", "cockroach", "node", "status", "--insecure", "--host=localhost:26257"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  cockroachdb-data:
